AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM Lab 2 - Users, Groups and Secrets Manager (ec2-user2 capped via Permissions Boundary)'


Resources:

  # ============================================================
  # SECRETS MANAGER - Auto-generated shared password
  # ============================================================
  IAMUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: IAMLab2SharedPassword
      Description: Shared temporary password for IAM lab users
      GenerateSecretString:
        PasswordLength: 16
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: true

  # ============================================================
  # IAM POLICIES
  # ============================================================

  # S3 Policy - list buckets only
  S3ListPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: S3ListBucketsPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:ListAllMyBuckets
            Resource: '*'

  # EC2 Policy - list instances + create instances
  EC2Policy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: EC2ListAndCreatePolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeInstanceTypes
              - ec2:DescribeImages
              - ec2:DescribeKeyPairs
              - ec2:CreateSecurityGroup
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - ec2:RunInstances
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:CreateTags
            Resource: '*'

  # ------------------------------------------------------------
  # PERMISSIONS BOUNDARY for ec2-user2
  # ------------------------------------------------------------
  # This does NOT grant anything on its own. It sets the CEILING
  # of what ec2-user2 can ever do. A user's effective permissions
  # are the INTERSECTION of their identity policies (here: inherited
  # from EC2UserGroup) and this boundary.
  #
  # Note that ec2:RunInstances is deliberately absent from the
  # allow list below. The group grants it, but the boundary does
  # not, so the intersection removes it -> ec2-user2 cannot launch
  # instances. No explicit Deny needed; the cap does the work.
  #
  # iam:ChangePassword + iam:GetAccountPasswordPolicy are re-granted
  # here on purpose: the boundary caps EVERYTHING, so without them
  # the forced first-login password reset would be blocked.
  # ------------------------------------------------------------
  EC2User2Boundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: EC2User2PermissionsBoundary
      Description: >-
        Maximum-permissions ceiling for ec2-user2. Allows the same EC2
        actions as the group EXCEPT ec2:RunInstances, plus self password change.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEC2ExceptRunInstances
            Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeInstanceTypes
              - ec2:DescribeImages
              - ec2:DescribeKeyPairs
              - ec2:CreateSecurityGroup
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:CreateTags
            Resource: '*'
          - Sid: AllowSelfPasswordChange
            Effect: Allow
            Action:
              - iam:ChangePassword
              - iam:GetAccountPasswordPolicy
            Resource: '*'

  # ============================================================
  # IAM GROUPS
  # ============================================================

  # S3 Group - can list S3 buckets
  S3UserGroup:
    Type: AWS::IAM::Group
    DependsOn: S3ListPolicy
    Properties:
      GroupName: S3UserGroup
      ManagedPolicyArns:
        - !Ref S3ListPolicy
        - arn:aws:iam::aws:policy/IAMUserChangePassword

  # EC2 Group - can list AND create EC2 instances
  EC2UserGroup:
    Type: AWS::IAM::Group
    DependsOn: EC2Policy
    Properties:
      GroupName: EC2UserGroup
      ManagedPolicyArns:
        - !Ref EC2Policy
        - arn:aws:iam::aws:policy/IAMUserChangePassword

  # ============================================================
  # IAM USERS
  # ============================================================

  # s3-user: assigned to S3 Group
  # S3User:
  #   Type: AWS::IAM::User
  #   DependsOn: IAMUserSecret
  #   Properties:
  #     UserName: s3-user
  #     Groups:
  #       - !Ref S3UserGroup
  #     LoginProfile:
  #       Password: !Sub '{{resolve:secretsmanager:IAMLab2SharedPassword:SecretString}}'
  #       PasswordResetRequired: true

  # ec2-user1: assigned to EC2 Group (can list and create EC2 instances)
  EC2User1:
    Type: AWS::IAM::User
    DependsOn: IAMUserSecret
    Properties:
      UserName: ec2-user1
      Groups:
        - !Ref EC2UserGroup
      LoginProfile:
        Password: !Sub '{{resolve:secretsmanager:IAMLab2SharedPassword:SecretString}}'
        PasswordResetRequired: true

  # ec2-user2: same EC2 Group as ec2-user1, but a permissions boundary
  # caps what the group grants. RunInstances is not in the boundary,
  # so it gets stripped from the effective permission set.
  EC2User2:
    Type: AWS::IAM::User
    DependsOn: IAMUserSecret
    Properties:
      UserName: ec2-user2
      Groups:
        - !Ref EC2UserGroup
      PermissionsBoundary: !Ref EC2User2Boundary   # <-- the ceiling
      LoginProfile:
        Password: !Sub '{{resolve:secretsmanager:IAMLab2SharedPassword:SecretString}}'
        PasswordResetRequired: true

Outputs:
  SecretArn:
    Description: ARN of the shared password secret
    Value: !Ref IAMUserSecret

  S3GroupArn:
    Description: ARN of S3 User Group
    Value: !GetAtt S3UserGroup.Arn

  EC2GroupArn:
    Description: ARN of EC2 User Group
    Value: !GetAtt EC2UserGroup.Arn

  EC2User2BoundaryArn:
    Description: ARN of the permissions boundary capping ec2-user2
    Value: !Ref EC2User2Boundary